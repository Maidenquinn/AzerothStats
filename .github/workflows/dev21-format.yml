name: dev21 format
on:
  push:
    branches: [fix/dev21-large-backup-ui]
    paths: [.github/dev21-format-trigger.txt]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          curl --fail --location --output /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          echo 'a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895  /tmp/stylua.zip' | sha256sum --check
          unzip /tmp/stylua.zip -d /tmp/azerothstats-stylua
          /tmp/azerothstats-stylua/stylua AzerothStats
          python tools/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothStats
          if ! git diff --cached --quiet; then
            git commit -m "style: dev21 formatting and manifest"
            git push origin HEAD:fix/dev21-large-backup-ui
          fi

name: Checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check tools AzerothStats/tests
      - name: Install pinned formatter
        run: |
          curl --fail --location --output /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          echo 'a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895  /tmp/stylua.zip' | sha256sum --check
          unzip /tmp/stylua.zip -d /tmp/azerothstats-stylua
          /tmp/azerothstats-stylua/stylua --check AzerothStats
      - run: python tools/build_catalogs.py --check
      - run: python tools/build_theme_assets.py --check
      - run: python tools/build_grimoire_assets.py --check
      - run: python tools/encode_painted_assets.py --check
      - run: python tools/build_run_images.py --check
      - run: python tools/check_fonts.py
      - run: python tools/build_insights_strings.py --check
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/security_review.py --report release-assets/ci/runtime-policy.json
      - run: python tools/checks.py
      - name: Benchmark synthetic backup scaling (100/500/1000 runs)
        run: python tools/benchmark_backups.py
      - run: python design/v2/tests/runtime_roundtrip.py
      - run: python tools/build_release.py --output release-assets/ci
      - name: Upload installable ZIP for in-game review (no release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AzerothStats-interop-pr-review
          path: release-assets/ci/*.zip
          retention-days: 7
          if-no-files-found: error

  lot1-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run all offline Lua model tests, manifest and LOT 1 assertions
        run: python tools/checks.py

name: LOT 2 dev15 manifest
on:
  push:
    branches: [feat/v2-lot2-combat-intelligence-20261103]
    paths: [.github/lot2-dev15-manifest-trigger.txt]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python tools/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothStats/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "build(v2): refresh dev.15 player checksums"
            git push origin HEAD:feat/v2-lot2-combat-intelligence-20261103
          fi

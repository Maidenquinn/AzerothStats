name: Publish run integrity and backups dev.20 prerelease
on:
  push:
    branches: [main]
    paths:
      - .github/dev20-release-marker.txt
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify version and test schema-preserving behavior
        run: |
          grep -q '^## Version: 2.0.0-dev.20$' AzerothStats/AzerothStats.toc
          python tools/checks.py
          python tools/build_catalogs.py --check
          python tools/build_insights_strings.py --check
      - name: Verify package policy and build installable artifact
        run: |
          python tools/build_release.py --output release-assets/dev20
          (cd release-assets/dev20 && sha256sum --check AzerothStats-2.0.0-dev.20.zip.sha256)
      - name: Publish a development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-dev.20 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release already exists, refusing to replace it.'
            exit 0
          fi
          cat > /tmp/dev20-notes.md <<'NOTES'
          ## AzerothStats 2.0.0-dev.20 — P0 run integrity and backup
          - Automatically creates a validated independent backup before destructive local-data operations.
          - New commands: /azstats backup, /azstats restore confirm, /azstats resync.
          - Run deletion now subtracts ledger-backed contributions from lifetime/class aggregates and invalidates only affected records.
          - Historical runs pruned by retention cannot be reconstructed; resync does not fabricate missing data.
          - Schema 1 and all other addons remain unchanged.
          
          **Development preview.** Offline checks pass; in-game acceptance is required. Keep an external copy of SavedVariables before testing. Install the attached player ZIP (not GitHub source archive) and fully restart the game.
          NOTES
          gh release create v2.0.0-dev.20 release-assets/dev20/AzerothStats-2.0.0-dev.20.zip release-assets/dev20/AzerothStats-2.0.0-dev.20.zip.sha256 --target "$GITHUB_SHA" --title "Azeroth Stats V2 Preview 2.0.0-dev.20" --notes-file /tmp/dev20-notes.md --prerelease --repo "${{ github.repository }}"

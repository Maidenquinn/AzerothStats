name: One-shot V2 catalog regeneration
on:
  push:
    branches:
      - feat/v2-lot1-foundations-20261103
    paths:
      - .github/lot1-catalog-trigger.txt
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Rebuild literal-only catalogs and package hashes
        run: |
          python tools/build_catalogs.py
          python tools/update_manifest.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothStats
          if ! git diff --cached --quiet; then
            git commit -m "build(v2): regenerate stale reviewed source catalogs"
            git push origin HEAD:feat/v2-lot1-foundations-20261103
          fi

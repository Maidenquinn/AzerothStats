name: Publish AzerothStats dev.28.1 test prerelease
on:
  push:
    branches:
      - feat/dev28-runs-navigation-filters
    paths:
      - .github/dev281-release-marker.txt
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify addon and package
        run: |
          grep -q '^## Version: 2.0.0-dev.28.1$' AzerothStats/AzerothStats.toc
          python tools/checks.py
          python tools/build_release.py --output release-assets/dev281
          (cd release-assets/dev281 && sha256sum --check AzerothStats-2.0.0-dev.28.1.zip.sha256)
      - name: Publish installable test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-dev.28.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          cat > /tmp/dev281-notes.md <<'NOTES'
          ## AzerothStats 2.0.0-dev.28.1 — My runs advanced filters (test)
          - Adds collapsible native Lua advanced filters for map, date, level, kills, gold and survival duration.
          - Adds input validation and combined local run filtering.
          - Improves navigation back from run comparison while retaining history pagination.
          - No destructive changes to statistics or saved data.
          - Test prerelease: please check UI layout and interactions in-game before final approval.
          NOTES
          gh release create v2.0.0-dev.28.1 release-assets/dev281/AzerothStats-2.0.0-dev.28.1.zip release-assets/dev281/AzerothStats-2.0.0-dev.28.1.zip.sha256 --target "$GITHUB_SHA" --title "Azeroth Stats V2 Preview 2.0.0-dev.28.1" --notes-file /tmp/dev281-notes.md --prerelease --repo "${{ github.repository }}"

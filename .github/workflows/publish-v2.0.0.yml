name: One-time approved v2.0.0 release
on:
  push:
    branches:
      - main
    paths:
      - .github/release-v2.0.0.trigger
permissions:
  contents: write
concurrency:
  group: azerothstats-v2.0.0-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify stable version and run offline checks
        run: |
          grep -qx '## Version: 2.0.0' AzerothStats/AzerothStats.toc
          python tools/checks.py
          python tools/build_release.py --output release-assets/stable
          test -s release-assets/stable/AzerothStats-2.0.0.zip
          test -s release-assets/stable/AzerothStats-2.0.0.zip.sha256
          (cd release-assets/stable && sha256sum -c AzerothStats-2.0.0.zip.sha256)
      - name: Publish public non-prerelease (explicitly approved for v2.0.0 only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.0.0 >/dev/null 2>&1; then
            gh release create v2.0.0 release-assets/stable/AzerothStats-2.0.0.zip release-assets/stable/AzerothStats-2.0.0.zip.sha256 \
              --title 'Azeroth Stats 2.0.0' \
              --notes-file docs/RELEASE-NOTES-2.0.0.md \
              --target "${GITHUB_SHA}" \
              --latest
          fi
          gh release view v2.0.0 --json isPrerelease,assets --jq '.isPrerelease' | grep -qx false
          gh release view v2.0.0 --json assets --jq '.assets[].name' | grep -Fx 'AzerothStats-2.0.0.zip'
          gh release view v2.0.0 --json assets --jq '.assets[].name' | grep -Fx 'AzerothStats-2.0.0.zip.sha256'
      - name: Remove superseded preview releases (retain Git tags for rollback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for tag in \
            v2.0.0-dev.14 v2.0.0-dev.15 v2.0.0-dev.16 v2.0.0-dev.17 \
            v2.0.0-dev.18 v2.0.0-dev.19 v2.0.0-dev.20 v2.0.0-dev.21 \
            v2.0.0-dev.22 v2.0.0-dev.23 v2.0.0-dev.24 v2.0.0-dev.25 \
            v2.0.0-dev.26 v2.0.0-dev.27 v2.0.0-dev.28 v2.0.0-dev.28.1
          do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes
            fi
          done
          gh release view v2.0.0 --json url --jq '.url'

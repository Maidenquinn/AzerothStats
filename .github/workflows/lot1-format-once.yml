name: One-shot V2 StyLua normalization
on:
  push:
    branches:
      - feat/v2-lot1-foundations-20261103
    paths:
      - .github/lot1-format-trigger.txt
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install SHA-verified StyLua
        run: |
          curl --fail --location --output /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          echo 'a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895  /tmp/stylua.zip' | sha256sum --check
          unzip /tmp/stylua.zip -d /tmp/azerothstats-stylua
      - name: Normalize Lua formatting and update the player SHA256 manifest
        run: |
          /tmp/azerothstats-stylua/stylua AzerothStats
          python tools/update_manifest.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothStats
          if ! git diff --cached --quiet; then
            git commit -m "style(v2): normalize inherited formatting for green CI"
            git push origin HEAD:feat/v2-lot1-foundations-20261103
          fi

name: dev18 black formatting
on:
  push:
    branches: [feat/v2-combat-ux-dev18]
    paths: [.github/dev18-black-trigger.txt]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python -m pip install black==25.1.0
          python -m black tools/checks.py
          python tools/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/checks.py AzerothStats/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "style: black format Combat UX regression checks"
            git push origin HEAD:feat/v2-combat-ux-dev18
          fi

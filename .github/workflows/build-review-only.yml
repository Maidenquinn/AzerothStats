name: Build addon for owner review (NO PUBLIC RELEASE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify and build installable addon (never publish)
        run: |
          python tools/checks.py
          python tools/build_release.py --output review-build
      - name: Upload review artifact (NOT PRIVATE on public repositories)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azerothstats-owner-review
          path: review-build/*.zip
          retention-days: 3
          if-no-files-found: error

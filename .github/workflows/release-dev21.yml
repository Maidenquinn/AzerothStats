name: Publish large backup and deletion UI dev.21 prerelease
on:
  push:
    branches: [main]
    paths:
      - .github/dev21-release-marker.txt
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify version and test schema-preserving behavior
        run: |
          grep -q '^## Version: 2.0.0-dev.21$' AzerothStats/AzerothStats.toc
          python tools/checks.py
          python tools/build_catalogs.py --check
          python tools/build_insights_strings.py --check
      - name: Verify package policy and build installable artifact
        run: |
          python tools/build_release.py --output release-assets/dev21
          (cd release-assets/dev21 && sha256sum --check AzerothStats-2.0.0-dev.21.zip.sha256)
      - name: Publish a development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-dev.21 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release already exists, refusing to replace it.'
            exit 0
          fi
          cat > /tmp/dev21-notes.md <<'NOTES'
          ## AzerothStats 2.0.0-dev.21 — Large backup and deletion UI
          - Backup traversal now uses the same 4-million-node and depth limits as saved-data validation.
          - Backup failures are surfaced in chat and retained in the deletion review dialog.
          - Deletion dialogs now describe ledger-aware totals and backup restoration accurately.
          - No player data is deleted when backup creation fails.
          
          **Development preview.** Offline checks pass; live testing on a copy of SavedVariables remains necessary.
          NOTES
          gh release create v2.0.0-dev.21 release-assets/dev21/AzerothStats-2.0.0-dev.21.zip release-assets/dev21/AzerothStats-2.0.0-dev.21.zip.sha256 --target "$GITHUB_SHA" --title "Azeroth Stats V2 Preview 2.0.0-dev.21" --notes-file /tmp/dev21-notes.md --prerelease --repo "${{ github.repository }}"

name: dev18 manifest final
on:
  push:
    branches: [feat/v2-combat-ux-dev18]
    paths: [.github/dev18-manifest-trigger.txt]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python tools/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothStats/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh dev18 release checksums"
            git push origin HEAD:feat/v2-combat-ux-dev18
          fi

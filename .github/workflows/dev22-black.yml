name: dev22 python style
on:
  push:
    branches: [fix/dev22-backup-overwrite]
    paths: [.github/dev22-black-trigger.txt]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python -m pip install black==25.1.0
          python -m black tools/security_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/security_review.py
          if ! git diff --cached --quiet; then
            git commit -m "style: black security policy"
            git push origin HEAD:fix/dev22-backup-overwrite
          fi

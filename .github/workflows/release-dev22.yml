name: Publish large backup and deletion UI dev.22 prerelease
on:
  push:
    branches: [main]
    paths:
      - .github/dev22-release-marker.txt
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify version and test schema-preserving behavior
        run: |
          grep -q '^## Version: 2.0.0-dev.22$' AzerothStats/AzerothStats.toc
          python tools/checks.py
          python tools/build_catalogs.py --check
          python tools/build_insights_strings.py --check
      - name: Verify package policy and build installable artifact
        run: |
          python tools/build_release.py --output release-assets/dev22
          (cd release-assets/dev22 && sha256sum --check AzerothStats-2.0.0-dev.22.zip.sha256)
      - name: Publish a development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-dev.22 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release already exists, refusing to replace it.'
            exit 0
          fi
          cat > /tmp/dev22-notes.md <<'NOTES'
          ## AzerothStats 2.0.0-dev.22 — Reliable backup workflow
          - Separate manual backup from automatically refreshed pre-deletion safety snapshot.
          - Settings now includes Backup now and two-click Restore backup controls.
          - Successful backup or restore triggers an automatic UI reload between runs.
          - The manual backup is no longer overwritten by subsequent run deletions.
          - Development prerelease: verify restoration on a copy of SavedVariables before relying on it.
          NOTES
          gh release create v2.0.0-dev.22 release-assets/dev22/AzerothStats-2.0.0-dev.22.zip release-assets/dev22/AzerothStats-2.0.0-dev.22.zip.sha256 --target "$GITHUB_SHA" --title "Azeroth Stats V2 Preview 2.0.0-dev.22" --notes-file /tmp/dev22-notes.md --prerelease --repo "${{ github.repository }}"
